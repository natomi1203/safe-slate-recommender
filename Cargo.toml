[package]
name = "safe-slate-recommender"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Certified anytime slate construction with Python bindings"
license = "Apache-2.0"
repository = "https://github.com/natomi1203/safe-slate-recommender"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[features]
coverage-internals = []

[dependencies]
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }
sha2 = "0.10.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
